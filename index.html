<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตารางแสดงสถานะการจองห้อง - อาคาร 60 ปี คณะสัตวแพทยศาสตร์ จุฬาฯ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #edf2f7;
      --card-bg: #ffffff;
      --header-bg: #486581; /* ฟ้าหม่น Slate Blue */
      --header-text: #ffffff;
      --border-color: #cbd5e1;
      --text-dark: #102a43;
      --text-muted: #627d98;
      
      /* Status Colors */
      --status-free: #e0f2fe;        /* ฟ้าอ่อน ว่าง */
      --status-free-border: #7dd3fc;
      --status-pending: #fef08a;     /* เหลือง ห้องถูกสนใจ */
      --status-pending-border: #eab308;
      --status-busy: #fbcfe8;        /* ชมพู ไม่ว่าง / ถูกจอง / ถูกใช้งาน */
      --status-busy-border: #f43f5e;
      --status-busy-icon: #be123c;   /* สีเงาสัตว์ชมพูเข้ม */
      --status-closed: #e2e8f0;      /* เทา ปิดบริการ */
      --status-closed-border: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Sarabun', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-dark);
      padding: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Control Bar */
    .top-bar {
      background-color: var(--header-bg);
      color: var(--header-text);
      border-radius: 12px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 12px rgba(16, 42, 67, 0.12);
      margin-bottom: 12px;
    }

    .system-title {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .system-title h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .realtime-clock {
      font-size: 1.5rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.18);
      padding: 4px 12px;
      border-radius: 8px;
      letter-spacing: 1px;
    }

    .date-display {
      font-size: 0.9rem;
      color: #d9e2ec;
      margin-top: 2px;
    }

    /* Legend Badges */
    .status-legend {
      display: flex;
      gap: 14px;
      align-items: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 30px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .legend-badge {
      display: inline-block;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1.5px solid;
    }

    .legend-badge.free { background: var(--status-free); border-color: var(--status-free-border); }
    .legend-badge.pending { background: var(--status-pending); border-color: var(--status-pending-border); }
    .legend-badge.busy { background: var(--status-busy); border-color: var(--status-busy-border); }
    .legend-badge.closed { background: var(--status-closed); border-color: var(--status-closed-border); }

    /* Library Logo Box */
    .logo-container {
      display: flex;
      align-items: center;
      background: #ffffff;
      padding: 4px 10px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      height: 52px;
    }

    .library-logo {
      height: 44px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    /* Main Table Container */
    .table-card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(16, 42, 67, 0.06);
      overflow: hidden;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .table-wrapper {
      overflow-x: auto;
      overflow-y: auto;
      flex: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      table-layout: fixed;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 10px 4px;
      font-size: 0.85rem;
    }

    th {
      background-color: #f1f5f9;
      color: #334e68;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 10;
      font-size: 0.82rem;
    }

    th.room-col-head {
      width: 130px;
      min-width: 130px;
      left: 0;
      z-index: 20;
      background-color: #e2e8f0;
    }

    td.room-name-cell {
      position: sticky;
      left: 0;
      background-color: #ffffff;
      font-weight: 600;
      color: #102a43;
      text-align: left;
      padding-left: 12px;
      z-index: 5;
      box-shadow: 2px 0 4px rgba(0,0,0,0.04);
    }

    .room-desc {
      display: block;
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--text-muted);
    }

    /* Time Slot Cells */
    .slot-cell {
      transition: all 0.2s ease;
      cursor: default;
      font-size: 1.15rem;
      user-select: none;
      vertical-align: middle;
    }

    .slot-cell.free {
      background-color: var(--status-free);
      color: #0284c7;
    }
    .slot-cell.free::after {
      content: "◯";
      font-size: 1.15rem;
      font-weight: bold;
    }

    .slot-cell.pending {
      background-color: var(--status-pending);
      color: #a16207;
    }
    .slot-cell.pending::after {
      content: "⏳";
      font-size: 1.05rem;
    }

    /* ช่อง Busy สำหรับแสดงรูปเงาสัตว์ SVG */
    .slot-cell.busy {
      background-color: var(--status-busy);
    }

    .animal-silhouette {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      animation: fadeInIcon 0.3s ease-in;
    }

    .animal-silhouette svg {
      width: 22px;
      height: 22px;
      fill: var(--status-busy-icon);
      opacity: 0.9;
    }

    @keyframes fadeInIcon {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 0.9; transform: scale(1); }
    }

    .slot-cell.closed {
      background-color: var(--status-closed);
      color: #94a3b8;
    }
    .slot-cell.closed::after {
      content: "—";
      font-size: 1.15rem;
      font-weight: bold;
    }

    /* Footer status info */
    .footer-bar {
      padding: 8px 18px;
      background: #f8fafc;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .pulse-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
  </style>
</head>
<body>

  <!-- Top Header Bar -->
  <header class="top-bar">
    <div class="system-title">
      <div>
        <h1 id="titleHeader">ตารางสถานะห้องประชุม (ห้องสมุดฯ อาคาร 60 ปี คณะสัตวแพทยศาสตร์ จุฬาฯ)</h1>
        <div class="date-display" id="dateDisplay">กำลังโหลดวันที่...</div>
      </div>
      <div class="realtime-clock" id="clock">00:00:00</div>
    </div>

    <!-- Status Legend -->
    <div class="status-legend">
      <div class="legend-item">
        <span class="legend-badge free"></span>
        <span id="lblFree">ว่าง (Free)</span>
      </div>
      <div class="legend-item">
        <span class="legend-badge pending"></span>
        <span id="lblPending">รออนุมัติ / สนใจ</span>
      </div>
      <div class="legend-item">
        <span class="legend-badge busy"></span>
        <span id="lblBusy">ไม่ว่าง / มีผู้ใช้งาน</span>
      </div>
      <div class="legend-item">
        <span class="legend-badge closed"></span>
        <span id="lblClosed">ปิดบริการ</span>
      </div>
    </div>

    <!-- Library Logo Section -->
    <div class="logo-container">
      <img src="https://cdn.phototourl.com/free/2026-09-07-daa6828c-663e-4342-8f19-94a0a1df7678.png" alt="โลโก้ห้องสมุด คณะสัตวแพทยศาสตร์ จุฬาฯ" class="library-logo">
    </div>
  </header>

  <!-- Table Board -->
  <main class="table-card">
    <div class="table-wrapper">
      <table id="scheduleTable">
        <thead>
          <tr id="headerRow">
            <th class="room-col-head">ชั้น / ห้อง</th>
          </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
      </table>
    </div>

    <footer class="footer-bar">
      <div>
        <span class="pulse-dot"></span>
        <span id="syncStatus">กำลังเชื่อมต่อระบบ Cloud...</span>
      </div>
      <div>อัปเดตล่าสุด: <span id="lastUpdated">-</span></div>
    </footer>
  </main>

  <!-- โหลดไฟล์ config.js และ data.js สำหรับใช้งานแบบสำรอง -->
  <script src="config.js"></script>
  <script id="cunexDataSource" src="data.js"></script>
  
  <script>
    // 1. นำการตั้งค่าจาก config.js มาใส่ในหน้าจอ
    function applyAdminConfig() {
      if (window.DASHBOARD_CONFIG) {
        const cfg = window.DASHBOARD_CONFIG;
        if (cfg.headerTitle) document.getElementById('titleHeader').textContent = cfg.headerTitle;
        if (cfg.legendFree) document.getElementById('lblFree').textContent = cfg.legendFree;
        if (cfg.legendPending) document.getElementById('lblPending').textContent = cfg.legendPending;
        if (cfg.legendBusy) document.getElementById('lblBusy').textContent = cfg.legendBusy;
        if (cfg.legendClosed) document.getElementById('lblClosed').textContent = cfg.legendClosed;
      }
    }
    applyAdminConfig();

    // 2. นาฬิกาและวันที่แบบ Realtime
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('th-TH', { hour12: false });
      document.getElementById('dateDisplay').textContent = now.toLocaleDateString('th-TH', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // รายการเวลามาตรฐาน 08:00 - 19:00 น. (ตัดช่วง 19:00 - 20:00 ออก)[cite: 1, 2]
    const defaultTimeSlots = [
      "08:00 - 09:00", "09:00 - 10:00", "10:00 - 11:00", "11:00 - 12:00",
      "12:00 - 13:00", "13:00 - 14:00", "14:00 - 15:00", "15:00 - 16:00",
      "16:00 - 17:00", "17:00 - 18:00", "18:00 - 19:00"
    ];

    // รายชื่อห้องประชุมมาตรฐานทั้งหมด 10 ห้อง ของอาคาร 60 ปี
    const ALL_REQUIRED_ROOMS = [
      { id: "905", name: "ห้อง 905", floor: "9", building: "อาคาร 60 ปี" },
      { id: "906", name: "ห้อง 906", floor: "9", building: "อาคาร 60 ปี" },
      { id: "907", name: "ห้อง 907", floor: "9", building: "อาคาร 60 ปี" },
      { id: "908", name: "ห้อง 908", floor: "9", building: "อาคาร 60 ปี" },
      { id: "927", name: "ห้อง 927", floor: "9", building: "อาคาร 60 ปี" },
      { id: "928", name: "ห้อง 928", floor: "9", building: "อาคาร 60 ปี" },
      { id: "929", name: "ห้อง 929", floor: "9", building: "อาคาร 60 ปี" },
      { id: "930", name: "ห้อง 930", floor: "9", building: "อาคาร 60 ปี" },
      { id: "931", name: "ห้อง 931", floor: "9", building: "อาคาร 60 ปี" },
      { id: "932", name: "ห้อง 932", floor: "9", building: "อาคาร 60 ปี" }
    ];

    // รูปเวกเตอร์เงาสัตว์แบบ Minimal Silhouettes (รอยเท้า, สุนัข, แมว, กระต่าย, ม้า)
    const ANIMAL_SILHOUETTES = [
      // 1. รอยเท้าสัตว์ (Paw)
      `<svg viewBox="0 0 24 24"><circle cx="4.5" cy="9.5" r="2.5"/><circle cx="9" cy="5.5" r="2.5"/><circle cx="15" cy="5.5" r="2.5"/><circle cx="19.5" cy="9.5" r="2.5"/><path d="M17.34 14.86c-.87-1.02-1.6-1.89-2.48-2.49-.9-.6-2.02-.97-2.86-.97s-1.96.37-2.86.97c-.88.6-1.61 1.47-2.48 2.49-1.25 1.47-1.82 3.14-.64 4.54.9 1.07 2.44 1.6 4.3 1.6h3.36c1.86 0 3.4-.53 4.3-1.6 1.18-1.4.61-3.07-.64-4.54z"/></svg>`,
      // 2. เงาสุนัข (Dog)
      `<svg viewBox="0 0 24 24"><path d="M19 12c-.6 0-1.1.2-1.6.5L16 11V7l-3-3H9L6 7v3.5L4.5 12C4.2 12.4 4 13 4 13.6c0 1.3 1 2.4 2.3 2.4h.7v4c0 .6.4 1 1 1h2c.6 0 1-.4 1-1v-4h2v4c0 .6.4 1 1 1h2c.6 0 1-.4 1-1v-4h.7c1.3 0 2.3-1.1 2.3-2.4 0-.6-.2-1.2-.5-1.6h.5c.6 0 1-.4 1-1s-.4-1-1-1z"/></svg>`,
      // 3. เงาแมว (Cat)
      `<svg viewBox="0 0 24 24"><path d="M12 13c-1.7 0-3 1.3-3 3v4c0 .6.4 1 1 1h4c.6 0 1-.4 1-1v-4c0-1.7-1.3-3-3-3zm-6-2.5L8.5 7h7L18 10.5V17c0 1.1-.9 2-2 2h-1v-3c0-1.7-1.3-3-3-3s-3 1.3-3 3v3H8c-1.1 0-2-.9-2-2v-6.5zM7.5 4l2.5 3H6.5L7.5 4zm9 0l1 3h-3.5L16.5 4z"/></svg>`,
      // 4. เงากระต่าย (Rabbit)
      `<svg viewBox="0 0 24 24"><path d="M18 14c-.6-1.1-1.6-1.9-2.7-2.3.4-.8.7-1.8.7-2.7 0-2.8-1.3-5-3-5-.9 0-1.7.6-2.2 1.5C10.3 4.6 9.5 4 8.5 4 6.8 4 5.5 6.2 5.5 9c0 1 .3 1.9.7 2.7C5.1 12.1 4.1 12.9 3.5 14c-1 1.7-.5 3.9 1.1 4.9.8.5 1.7.8 2.6.8.5 0 1-.1 1.5-.2 1 .4 2.1.5 3.3.5s2.3-.1 3.3-.5c.5.1 1 .2 1.5.2.9 0 1.8-.3 2.6-.8 1.6-1 2.1-3.2 1.2-4.9z"/></svg>`,
      // 5. เงาม้า (Horse)
      `<svg viewBox="0 0 24 24"><path d="M20.5 8.5L17 5l-2.5 1.5L13 4 8 7v4l-2 1.5V17l2 1v3h3v-3h2v3h3v-4.5l1.5-2.5 1.5-1.5-.5-1z"/></svg>`
    ];

    function getAnimalSilhouette(seedStr) {
      let hash = 0;
      for (let i = 0; i < seedStr.length; i++) {
        hash = seedStr.charCodeAt(i) + ((hash << 5) - hash);
      }
      const index = Math.abs(hash) % ANIMAL_SILHOUETTES.length;
      return `<span class="animal-silhouette">${ANIMAL_SILHOUETTES[index]}</span>`;
    }

    function renderTableHeader(slots) {
      const headerRow = document.getElementById('headerRow');
      headerRow.innerHTML = '<th class="room-col-head">ชั้น / ห้อง</th>';
      slots.forEach(slot => {
        const th = document.createElement('th');
        th.textContent = slot;
        headerRow.appendChild(th);
      });
    }

    function renderTableData(rooms, slots) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      rooms.forEach(room => {
        const tr = document.createElement('tr');

        const tdRoom = document.createElement('td');
        tdRoom.className = 'room-name-cell';
        tdRoom.innerHTML = `${room.room_name} <span class="room-desc">${room.floor ? 'ชั้น ' + room.floor : ''} ${room.building || ''}</span>`;
        tr.appendChild(tdRoom);

        slots.forEach(slot => {
          const tdSlot = document.createElement('td');
          tdSlot.className = 'slot-cell';
          
          let status = 'free';
          if (room.slots) {
            for (let k in room.slots) {
              if (k.includes(slot) || slot.includes(k) || k.trim() === slot.trim()) {
                status = room.slots[k];
                break;
              }
            }
          }
          tdSlot.classList.add(status);

          // ถ้าสถานะเป็น busy (ไม่ว่าง/ถูกจอง) ให้แสดงเงาสัตว์ SVG
          if (status === 'busy') {
            tdSlot.innerHTML = getAnimalSilhouette(room.room_name + slot);
          }

          tr.appendChild(tdSlot);
        });

        tbody.appendChild(tr);
      });
    }

    function applyData(data, sourceLabel = "ระบบ Cloud (Google Sheets)") {
      const syncStatus = document.getElementById('syncStatus');
      const lastUpdated = document.getElementById('lastUpdated');
      const scrapedRooms = data.rooms || [];
      
      let activeSlots = defaultTimeSlots;
      if (scrapedRooms.length > 0 && scrapedRooms[0].slots) {
        const keys = Object.keys(scrapedRooms[0].slots);
        if (keys.length > 0) {
          activeSlots = keys.filter(slot => !slot.includes("19:00 - 20:00") && !slot.startsWith("19:") && !slot.startsWith("20:"));
        }
      }

      // แมปรายชื่อห้องให้ครบทั้ง 10 ห้องเสมอ ป้องกันห้อง 906 หาย
      const finalRooms = ALL_REQUIRED_ROOMS.map(reqRoom => {
        const found = scrapedRooms.find(r => r.room_name && r.room_name.includes(reqRoom.id));
        if (found) {
          return found;
        } else {
          const closedSlots = {};
          activeSlots.forEach(s => closedSlots[s] = 'closed');
          return {
            room_name: reqRoom.name + " (ปรับปรุง)",
            floor: reqRoom.floor,
            building: reqRoom.building,
            slots: closedSlots
          };
        }
      });

      renderTableHeader(activeSlots);
      renderTableData(finalRooms, activeSlots);
      lastUpdated.textContent = data.updated_at || new Date().toLocaleTimeString('th-TH');
      syncStatus.textContent = `เชื่อมต่อปกติผ่าน ${sourceLabel} (ดึงข้อมูลอัตโนมัติทุก 15 นาที)`;
    }

    // แคชในเครื่อง เพื่อให้เปิดหน้าเว็บแล้วขึ้นทันทีใน 0 วินาที
    const CACHE_KEY = "CUNEX_ROOMS_CACHE";

    function loadFromLocalCache() {
      try {
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
          const parsed = JSON.parse(cached);
          if (parsed && parsed.rooms) {
            applyData(parsed, "หน่วยความจำในเครื่อง (โหลดทันที)");
            return true;
          }
        }
      } catch (e) {
        console.warn("อ่านแคชไม่สำเร็จ:", e);
      }
      return false;
    }

    // ดึงข้อมูลแบบ Fast-Cache + Background Sync
    async function refreshBookingData() {
      const syncStatus = document.getElementById('syncStatus');
      const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzjnkoN0q3jQPkQTMnxmpbn1Tthlg4vSBBY6U68EX60kBHwpl_fHv_6DYMcqAdJ00g7/exec";

      // 1. นำข้อมูลในเครื่องมาแสดงผลทันทีก่อน
      const hasCache = loadFromLocalCache();
      if (!hasCache) {
        if (window.CUNEX_DATA && window.CUNEX_DATA.rooms && window.CUNEX_DATA.rooms.length > 0) {
          applyData(window.CUNEX_DATA, "ไฟล์ในเครื่อง (data.js)");
        }
      }

      // 2. แอบดึงข้อมูลสดจาก Cloud มาอัปเดตเบื้องหลัง
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 12000);

        const res = await fetch(GAS_API_URL + "?t=" + Date.now(), { signal: controller.signal });
        clearTimeout(timeoutId);

        if (res.ok) {
          const data = await res.json();
          if (data && data.rooms && data.rooms.length > 0) {
            try {
              localStorage.setItem(CACHE_KEY, JSON.stringify(data));
            } catch (e) {}

            applyData(data, "Google Sheets (คลาวด์สด)");
            return;
          }
        }
      } catch (err) {
        console.warn("Cloud ตอบสนองช้า กำลังแสดงผลจากข้อมูลล่าสุด:", err);
      }

      if (!hasCache && (!window.CUNEX_DATA || !window.CUNEX_DATA.rooms)) {
        syncStatus.textContent = "กำลังรอข้อมูลรอบถัดไปจากระบบ...";
      }
    }

    renderTableHeader(defaultTimeSlots);
    refreshBookingData();

    // ตรวจสอบข้อมูลใหม่ทุก 60 วินาที[cite: 1, 2]
    setInterval(refreshBookingData, 60000);
  </script>
</body>
</html>
