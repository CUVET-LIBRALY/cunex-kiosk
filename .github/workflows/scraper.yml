name: CU NEX Auto Scraper

on:
  schedule:
    # รันทุก 15 นาที ระหว่างเวลา 07:00 - 19:45 น. ตามเวลาไทย (00:00 - 12:45 UTC) ทุกวันจันทร์-เสาร์
    - cron: '*/15 0-12 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: ตรวจสอบที่เก็บข้อมูล (Checkout)
        uses: actions/checkout@v4

      - name: ติดตั้ง Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ติดตั้งส่วนประกอบที่จำเป็น (Dependencies & Playwright)
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      - name: เรียกใช้ Scraper
        env:
          CUNEX_USER: ${{ secrets.CUNEX_USER }}
          CUNEX_PASS: ${{ secrets.CUNEX_PASS }}
          BUILDING_ID: ${{ secrets.BUILDING_ID }}
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          python cunex_scraper_cloud.py

      - name: บันทึกและส่ง data.js ขึ้น GitHub อัตโนมัติ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data.js [skip ci]" && git push)
