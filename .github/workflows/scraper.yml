name: CUNEX Auto Sync

on:
  schedule:
    # รันอัตโนมัติทุกๆ 5 นาที ระหว่างเวลา 07:30 - 19:00 น. (เวลาไทย) วันจันทร์-ศุกร์
    - cron: '30-59/5 0 * * 1-5'
    - cron: '*/5 1-11 * * 1-5'
    - cron: '0 12 * * 1-5'
  workflow_dispatch: # เพิ่มปุ่มกดสั่งรันด้วยตนเอง

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Scraper
        env:
          CUNEX_USER: ${{ secrets.CUNEX_USER }}
          CUNEX_PASS: ${{ secrets.CUNEX_PASS }}
          WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          python cunex_scraper_cloud.py

      - name: Upload Debug Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: '*.png'
